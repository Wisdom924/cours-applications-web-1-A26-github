services:
  web:
    build: .
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./exemples:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-commerce}
      DB_USER: ${DB_USER:-coursphp}
      DB_PASSWORD: ${DB_PASSWORD:-php2026}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-commerce}
      MYSQL_USER: ${DB_USER:-coursphp}
      
      MYSQL_PASSWORD: ${DB_PASSWORD:-php2026}

      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root2026}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["admin"]
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
